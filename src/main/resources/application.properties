# API Compatibility Analyzer configuration

# Wall clock budget (ms) for a single analysis run. On timeout the run is aborted
# and no partial report is published; the previously published report stays readable.
analyzer.timeout-millis=60000

# Maximum number of .java files accepted in one snapshot.
analyzer.max-files=10000

# Maximum size in bytes of a single source file.
analyzer.max-file-bytes=2097152

# Soft heap budget in MB. Exceeding it fails the run rather than emitting a half report.
analyzer.max-memory-mb=512

# Directory where published baselines (exemptions included) are stored as JSON.
analyzer.baseline-dir=./.api-compat/baselines

# Deterministic JSON over HTTP.
spring.jackson.default-property-inclusion=always
